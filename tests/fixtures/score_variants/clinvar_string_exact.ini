# Rank model scoring ClinVar classifications from a VEP CSQ column with string rules.
# exact_match = true compares whole tokens instead of substrings, see genmod issue #87.
[Version]
  version = 0.1
  name = clinvar string exact

[Categories]
  [[Clinical_significance]]
    category_aggregation = max

[CLNSIG]
  field = INFO
  data_type = string
  category = Clinical_significance
  record_rule = max
  separators = '&',
  info_key = CSQ
  csq_key = CLNSIG
  exact_match = true
  description = ClinVar classification from the VEP CSQ annotation

  [[not_reported]]
    score = 0

  [[pathogenic]]
    score = 5
    priority = 5
    string = 'Pathogenic'

  [[likely_pathogenic]]
    score = 2
    priority = 4
    string = 'Likely_pathogenic'

  [[uncertain_significance]]
    score = 0
    priority = 3
    string = 'Uncertain_significance'

  [[likely_benign]]
    score = -1
    priority = 2
    string = 'Likely_benign'

  [[benign]]
    score = -2
    priority = 1
    string = 'Benign'
