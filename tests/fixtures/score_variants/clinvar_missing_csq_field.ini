# The ClinVar rank model with an extra plugin scoring a CSQ column that is not in the VEP
# annotation of clinvar_csq.vcf (genmod issue #85). The extra plugin sits in its own category
# and scores 0 for variants where the column is missing, so rank scores equal those of
# clinvar_string_exact.ini.
[Version]
  version = 0.1
  name = clinvar missing csq field

[Categories]
  [[Clinical_significance]]
    category_aggregation = max
  [[Missing_field]]
    category_aggregation = max

[CLNSIG]
  field = INFO
  data_type = string
  category = Clinical_significance
  record_rule = max
  separators = '&',
  info_key = CSQ
  csq_key = CLNSIG
  description = ClinVar classification from the VEP CSQ annotation

  [[not_reported]]
    score = 0

  [[pathogenic]]
    score = 5
    priority = 5
    string = 'Pathogenic'

  [[likely_pathogenic]]
    score = 2
    priority = 4
    string = 'Likely_pathogenic'

  [[uncertain_significance]]
    score = 0
    priority = 3
    string = 'Uncertain_significance'

  [[likely_benign]]
    score = -1
    priority = 2
    string = 'Likely_benign'

  [[benign]]
    score = -2
    priority = 1
    string = 'Benign'

[NOT_IN_VEP]
  field = INFO
  data_type = string
  category = Missing_field
  record_rule = max
  separators = '&',
  info_key = CSQ
  csq_key = NOT_IN_VEP
  description = A CSQ column that is not in the VEP annotation of the VCF

  [[not_reported]]
    score = 0

  [[present]]
    score = 3
    priority = 1
    string = 'present'
