# Rank model scoring SnpEff ANN fields (genmod issue #96).
# For info_key = ANN, csq_key names the ANN field, like it names the CSQ column for VEP.
[Version]
  version = 0.1
  name = snpeff ann

[Categories]
  [[Impact]]
    category_aggregation = max
  [[Consequence]]
    category_aggregation = max

[Annotation_Impact]
  field = INFO
  data_type = string
  category = Impact
  record_rule = max
  separators = '&',
  info_key = ANN
  csq_key = Annotation_Impact
  description = The putative impact from the SnpEff ANN annotation

  [[not_reported]]
    score = 0

  [[high]]
    score = 5
    priority = 4
    string = 'HIGH'

  [[moderate]]
    score = 3
    priority = 3
    string = 'MODERATE'

  [[low]]
    score = 1
    priority = 2
    string = 'LOW'

  [[modifier]]
    score = 0
    priority = 1
    string = 'MODIFIER'

[Annotation]
  field = INFO
  data_type = string
  category = Consequence
  record_rule = max
  separators = '&',
  info_key = ANN
  csq_key = Annotation
  description = The SO terms from the SnpEff ANN annotation

  [[not_reported]]
    score = 0

  [[stop_gained]]
    score = 5
    priority = 5
    string = 'stop_gained'

  [[splice_region_variant]]
    score = 4
    priority = 4
    string = 'splice_region_variant'

  [[missense_variant]]
    score = 3
    priority = 3
    string = 'missense_variant'

  [[conservative_inframe_deletion]]
    score = 2
    priority = 2
    string = 'conservative_inframe_deletion'

  [[synonymous_variant]]
    score = 1
    priority = 1
    string = 'synonymous_variant'
