# The SnpEff rank model with an extra plugin scoring an ANN field that is not in the ANN
# header of snpeff_trio.vcf. It scores 0 when missing, so rank scores equal snpeff_rank_model.ini.
[Version]
  version = 0.1
  name = snpeff missing ann field

[Categories]
  [[Impact]]
    category_aggregation = max
  [[Consequence]]
    category_aggregation = max
  [[Missing_field]]
    category_aggregation = max

[Annotation_Impact]
  field = INFO
  data_type = string
  category = Impact
  record_rule = max
  separators = '&',
  info_key = ANN
  csq_key = Annotation_Impact
  description = The putative impact from the SnpEff ANN annotation

  [[not_reported]]
    score = 0

  [[high]]
    score = 5
    priority = 4
    string = 'HIGH'

  [[moderate]]
    score = 3
    priority = 3
    string = 'MODERATE'

  [[low]]
    score = 1
    priority = 2
    string = 'LOW'

  [[modifier]]
    score = 0
    priority = 1
    string = 'MODIFIER'

[Annotation]
  field = INFO
  data_type = string
  category = Consequence
  record_rule = max
  separators = '&',
  info_key = ANN
  csq_key = Annotation
  description = The SO terms from the SnpEff ANN annotation

  [[not_reported]]
    score = 0

  [[stop_gained]]
    score = 5
    priority = 5
    string = 'stop_gained'

  [[splice_region_variant]]
    score = 4
    priority = 4
    string = 'splice_region_variant'

  [[missense_variant]]
    score = 3
    priority = 3
    string = 'missense_variant'

  [[conservative_inframe_deletion]]
    score = 2
    priority = 2
    string = 'conservative_inframe_deletion'

  [[synonymous_variant]]
    score = 1
    priority = 1
    string = 'synonymous_variant'

[NOT_IN_ANN]
  field = INFO
  data_type = string
  category = Missing_field
  record_rule = max
  separators = '&',
  info_key = ANN
  csq_key = NOT_IN_ANN
  description = An ANN field that is not in the ANN header of the VCF

  [[not_reported]]
    score = 0

  [[present]]
    score = 3
    priority = 1
    string = 'present'
