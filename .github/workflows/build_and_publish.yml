name: Publish to PyPI

on:
 release:
  types:
   - created

jobs:
 pypi:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv build
      - run: uv publish --trusted-publishing always

 docker-image-CI:
   name: Docker Image CI
   runs-on: ubuntu-latest
   steps:

    - name: Check out git repository
      uses: actions/checkout@v7

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@v4

    - name: Publish server image (Dockerfile-server) to Registry
      uses: docker/build-push-action@v7
      with:
        context: ./
        file: ./Dockerfile
        push: true
        provenance: mode=max
        sbom: true
        tags: "clinicalgenomics/genmod:latest, clinicalgenomics/genmod:${{ github.event.release.tag_name }}"


 deploy-docs:
    name: Deploy Docs to GitHubIO
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
     - name: Checkout repo
       uses: actions/checkout@v7
     - name: Setup uv
       uses: astral-sh/setup-uv@v10
     - name: Build documentation
       run: uv run --only-group docs zensical build --strict
     - name: Upload documentation
       uses: actions/upload-pages-artifact@v5
       with:
         path: site
     - name: Deploy documentation
       id: deployment
       uses: actions/deploy-pages@v5
